<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Crown Clash</title>
  <meta name="description" content="Crown Clash — a royal arena card battler with 3D troops. Plays entirely in your browser.">
  <meta name="theme-color" content="#0b1230">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 52 26 32 61 12 26Z' fill='%232f8fff'/%3E%3Cpath d='M32 3 52 26 32 34Z' fill='%239fd6ff'/%3E%3Cpath d='M32 34 52 26 32 61Z' fill='%23163f86'/%3E%3C/svg%3E">
  <style>
    /* Critical layout + boot splash. Everything else lives in css/style.css. */
    html, body { margin: 0; height: 100%; background: #0b1230; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
    #ui-root { overflow: hidden; overflow: clip; }
    #game-canvas, #overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay-canvas { pointer-events: none; }
    #ui-root { position: absolute; inset: 0; pointer-events: none; }
    #boot { position: absolute; inset: 0; z-index: 100; background: black; transition: opacity .5s ease; }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot video { width: 100%; height: 100%; object-fit: contain; display: block; }
    #boot-msg { position: absolute; bottom: 10%; width: 100%; text-align: center; background: #171717; }
  </style>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/royale.css">
  <link rel="stylesheet" href="css/arena-ui.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/build/three.module.min.js",
      "three/addons/": "./assets/vendor/three/examples/jsm/"
    }
  }
  </script>
  <link rel="modulepreload" href="assets/vendor/three/build/three.module.min.js">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <video id="boot-video" src="assets/loading.mp4" playsinline preload="auto" aria-label="Loading Crown Clash"></video>
      <div id="boot-msg" role="status" hidden></div>
    </div>
  </div>
  <noscript>Crown Clash needs JavaScript and WebGL to run.</noscript>
  <script>
    const intro = document.getElementById('boot-video');
    window.introFinished = new Promise(resolve => {
      intro.addEventListener('ended', resolve, { once: true });
      intro.addEventListener('error', resolve, { once: true });
      document.getElementById('boot').addEventListener('click', () => {
        if (!intro.muted || intro.ended) return;
        intro.muted = false;
        intro.play().catch(resolve);
      });
      intro.play().catch(error => {
        if (error.name !== 'NotAllowedError') { resolve(); return; }
        intro.muted = true;
        intro.play().catch(resolve);
      });
    });
    // Surface boot failures on the splash instead of a silent blank page.
    window.__bootError = function (msg) {
      var el = document.getElementById('boot-msg');
      var boot = document.getElementById('boot');
      if (el && boot && !boot.classList.contains('hide')) { el.hidden = false; el.textContent = msg; el.style.color = '#ffb0a0'; }
    };
    window.addEventListener('error', function (e) { window.__bootError('Could not start: ' + (e.message || 'script error')); });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootError('Could not start: ' + ((e.reason && e.reason.message) || e.reason || 'error'));
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
